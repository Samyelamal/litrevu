{% extends "base.html" %}

{% block title %}Inscription{% endblock %}

{% block content %}
    <h1>Inscrivez-vous</h1>

    <form method="post" novalidate class="formulaire">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="erreur" role="alert">{{ form.non_field_errors }}</div>
        {% endif %}
        {{ form.as_div }}
        <div class="actions">
            <a href="{% url 'login' %}" class="bouton bouton-secondaire">Retourner</a>
            <button type="submit" class="bouton">S'inscrire</button>
        </div>
    </form>
{% endblock %}
